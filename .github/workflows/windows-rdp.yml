
- name: 3. Install and Connect Tailscale
  shell: pwsh
  timeout-minutes: 5
  env:
    TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
  run: |
    $ErrorActionPreference = "Stop"

    $msi = "$env:TEMP\tailscale.msi"
    $log = "$env:TEMP\tailscale-install.log"
    $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

    try {
      if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
        throw "Missing GitHub secret: TAILSCALE_AUTHKEY"
      }

      Write-Host "STEP 1: Checking network access..."
      Test-NetConnection pkgs.tailscale.com -Port 443 |
        Format-List ComputerName, RemotePort, TcpTestSucceeded

      Write-Host "STEP 2: Downloading Tailscale MSI..."
      Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
        -OutFile $msi `
        -TimeoutSec 90

      if (!(Test-Path $msi)) {
        throw "MSI download did not produce a file."
      }

      Write-Host "STEP 3: Installing Tailscale..."
      $proc = Start-Process msiexec.exe `
        -ArgumentList "/i `"$msi`" /quiet /norestart /L*v `"$log`"" `
        -Wait -PassThru

      if ($proc.ExitCode -notin @(0, 3010)) {
        if (Test-Path $log) {
          Get-Content $log -Tail 50
        }
        throw "MSI installation failed. Exit code: $($proc.ExitCode)"
      }

      if (!(Test-Path $exe)) {
        throw "tailscale.exe not found at expected path: $exe"
      }

      Write-Host "STEP 4: Starting Tailscale service..."
      $svc = Get-Service Tailscale -ErrorAction Stop

      if ($svc.Status -ne "Running") {
        Start-Service Tailscale
      }

      $deadline = (Get-Date).AddSeconds(45)
      do {
        Start-Sleep -Seconds 2
        $svc = Get-Service Tailscale
      } while ($svc.Status -ne "Running" -and
               (Get-Date) -lt $deadline)

      if ($svc.Status -ne "Running") {
        throw "Tailscale service failed to start."
      }

      Write-Host "STEP 5: Connecting to Tailscale..."
      & $exe up `
        "--auth-key=$env:TAILSCALE_AUTHKEY" `
        "--hostname=github-rdp-server" `
        "--timeout=45s"

      $upExit = $LASTEXITCODE

      if ($upExit -ne 0) {
        & $exe status
        throw "tailscale up failed. Exit code: $upExit"
      }

      Write-Host "STEP 6: Verifying connection..."
      & $exe status
      if ($LASTEXITCODE -ne 0) {
        throw "Tailscale status command failed."
      }

      $ipOutput = & $exe ip -4
      $ipExit = $LASTEXITCODE

      if ($ipExit -ne 0) {
        throw "Unable to query Tailscale IPv4 address."
      }

      $ts_ip = $ipOutput |
        Where-Object { $_ -match '^\d{1,3}(\.\d{1,3}){3}$' } |
        Select-Object -First 1

      if (!$ts_ip) {
        throw "No Tailscale IPv4 address was assigned."
      }

      Write-Host "SUCCESS: Tailscale connected."
      Write-Host "Tailscale IP: $ts_ip"
    }
    catch {
      Write-Host "::error::Tailscale setup failed: $($_.Exception.Message)"

      Write-Host "Diagnostic: Windows service status"
      Get-Service Tailscale -ErrorAction SilentlyContinue |
        Format-List Name, Status, StartType

      if (Test-Path $log) {
        Write-Host "Last MSI installer log entries:"
        Get-Content $log -Tail 30
      }

      throw
    }
